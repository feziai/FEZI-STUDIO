<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FEZI Studio · وضعیت سرویس‌های API</title><link rel="icon" type="image/png" href="/brand/fezi-official-favicon-64.png"><style>*{box-sizing:border-box}body{margin:0;font:14px/1.8 system-ui;background:linear-gradient(125deg,#e9f5ff,#ffeff8);color:#2b4476}main{max-width:890px;margin:40px auto;padding:18px}.box{background:white;border:1px solid #dce6f8;border-radius:20px;padding:25px;box-shadow:0 10px 40px #abc4e62c}.header{display:flex;align-items:center;gap:13px}.header img{width:56px;height:56px;object-fit:contain}h1{font-size:26px;margin:0}p{font-size:13px;color:#637c9d}a{color:#166fd8;text-decoration:none}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{text-align:right;border-bottom:1px solid #e8eff9;padding:12px;font-size:12px}.yes{color:#187954;font-weight:800}.no{color:#b86844;font-weight:700}.info{padding:13px;border-radius:12px;background:#f5f9ff}.links{display:flex;gap:12px;flex-wrap:wrap;font-weight:700;font-size:12px}button{border:0;border-radius:10px;background:#2675ea;color:#fff;padding:11px 18px;font:inherit;cursor:pointer}</style></head><body><main><section class="box"><div class="header"><img src="/brand/fezi-site-f.png" alt="FEZI F"><div><h1>وضعیت APIها و ربات‌ها</h1><p>فقط ادمین سایت می‌تواند این صفحه را مشاهده کند.</p></div></div><p class="info">وجود متغیر محرمانه در هاست فقط یعنی «پیکربندی شده»، نه اینکه اتصال واقعاً تست شده یا خدمات پولی فعال شده باشد. هیچ توکنی نمایش داده نمی‌شود.</p><button type="button" id="refresh">بررسی وضعیت پیکربندی</button><div id="result" role="status">در حال بررسی…</div><div class="links"><a href="/admin/operations">پنل عملیات</a><a href="/api-keys">فروشگاه API Keys</a><a href="/purchase">صفحه خرید</a><a href="/">خانه</a></div></section></main><script>
async function load(){const box=document.getElementById('result');try{const r=await fetch('/api/admin/api-providers',{credentials:'same-origin'});if(!r.ok)throw Error(r.status===401?'برای ورود به پنل ادمین از صفحه مدیریت وارد شوید.':'HTTP '+r.status);const data=await r.json();const t=document.createElement('table');const thead=document.createElement('tr');for(const title of ['سرویس','کلید در محیط سرور','وضعیت تأیید اتصال']){const th=document.createElement('th');th.textContent=title;thead.append(th)}t.append(thead);for(const item of data.providers){const tr=document.createElement('tr');for(const [txt,cl] of [[item.name,''],[item.configured?'موجود':'وارد نشده',item.configured?'yes':'no'],[item.status==='configured_unverified'?'نیازمند تست واقعی':'غیرفعال',item.configured?'no':'']]){const td=document.createElement('td');td.textContent=txt;td.className=cl;tr.append(td)}t.append(tr)}box.replaceChildren(t)}catch(e){box.textContent=e.message}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
