<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FEZI Studio — Community Review</title><link rel="stylesheet" href="/studio/ui.css"></head><body><header class="top"><a class="brand" href="/"><img src="/brand/fezi-rabbit-f.png" alt="FEZI logo">FEZI STUDIO</a><nav><a href="/admin/faq">Manage FAQ</a><a href="/community">Community</a><a href="/builder">Owner login</a></nav></header><main class="wrap"><div class="pane"><h1>Community Moderation</h1><p>Only the authenticated owner can approve user submissions. Check rights and content carefully before making a post public.</p><button id="refresh" class="btn">Load pending posts</button><output id="status"></output><div id="items" class="feed"></div></div></main><script>const e=s=>document.querySelector(s);async function load(){const r=await fetch('/api/admin/community/pending');if(!r.ok){e('#status').textContent='Owner login is required. Log in via /builder first.';return}const d=await r.json();e('#items').replaceChildren();for(const p of d.posts){const c=document.createElement('div');c.className='pane';const h=document.createElement('h3');h.textContent=p.title;const note=document.createElement('p');note.textContent='Submitted by '+p.author+' · '+p.kind+' · '+p.prompt.slice(0,700);c.append(h,note);if(p.mime==='video/mp4'){const v=document.createElement('video');v.src='/api/admin/community/preview/'+p.id;v.controls=true;v.style.cssText='width:min(100%,500px);max-height:320px';c.append(v)}else if(p.mime?.startsWith('image/')){const img=document.createElement('img');img.src='/api/admin/community/preview/'+p.id;img.alt='Pending creator upload - review before approval';img.style.cssText='max-width:min(100%,500px);max-height:320px;object-fit:contain';c.append(img)}for(const action of ['approve','reject']){const b=document.createElement('button');b.textContent=action;b.className=action==='approve'?'btn':'secondary';b.onclick=async()=>{const r=await fetch('/api/admin/community/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:p.id,action})});const d=await r.json();alert(d.error||d.status);load()};c.append(b)}e('#items').append(c)}e('#status').textContent=d.posts.length+' pending items. Do not approve unverified media.'}e('#refresh').onclick=load;load();</script></body></html>
