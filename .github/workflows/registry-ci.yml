name: FEZI public catalog CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-registry.mjs
      - run: node scripts/security-scan.mjs
      - name: Check fleet source
        working-directory: agent-fleet
        run: |
          npm install --ignore-scripts
          npm run check
          npm test
