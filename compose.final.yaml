# One container for FEZI Studio web modules. Public HTTPS is handled by a reverse proxy.
services:
  fezi-studio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - fezi_studio_data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
volumes:
  fezi_studio_data: {}
