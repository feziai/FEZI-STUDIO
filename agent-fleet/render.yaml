services:
  - type: web
    name: fezi-agent-fleet
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_POLLING
        value: "true"
      - key: DASHBOARD_TOKEN
        sync: false
      # After deploy, set BOT_TOKEN_ARINA and each other BOT_TOKEN_* privately.
      # Set OPENAI_API_KEY privately if AI-generated replies are required.
