openapi: 3.1.0
info:
  title: FEZI Agent Fleet API
  version: 1.0.0
  description: Read-only agent status/catalog, with optional authenticated private chat.
servers:
  - url: https://YOUR-DOMAIN.example
paths:
  /api/status:
    get:
      operationId: getFleetStatus
      summary: Check live fleet status
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: {type: integer}
                  total: {type: integer}
                  aiConnected: {type: boolean}
  /api/agents:
    get:
      operationId: getFleetAgents
      summary: List configured profiles and connection states
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/skills:
    get:
      operationId: getFleetSkills
      summary: List skill templates
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/chat:
    post:
      operationId: chatWithFeziAgent
      summary: Private agent chat, requires dashboard bearer token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, agentId]
              properties:
                message: {type: string}
                agentId: {type: string}
      responses:
        '200':
          description: Answer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
