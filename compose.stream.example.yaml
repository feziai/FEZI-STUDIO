# Optional self-hosted stream relay. NOT runnable on ordinary shared cPanel Node hosting.
# Requires a trusted Docker VPS with capacity and legally usable media.
# SRS: MIT, https://github.com/ossrs/srs . No video assets or AI generated clips are bundled.
services:
  fezi-srs:
    image: ossrs/srs:6
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest; firewall to your encoder IP only
      - "8080:8080"   # HLS HTTP; terminate TLS through your proxy
    # Do not expose SRS admin API port 1985 to the public internet.
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/srs/srs.conf"]
      interval: 60s
      timeout: 10s
      retries: 3
